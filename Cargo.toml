[workspace]
resolver = "1"
members = [
    "crates/shaide",
    "crates/shaide-common",
    "crates/shaide-db",
    "crates/shaide-cli",
]

[workspace.package]
version = "0.11.0"
edition = "2024"
authors = ["shaide"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
tokio = {version = "1.52.3", features = ["rt-multi-thread"]} 
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
anyhow = "1.0.71"
reqwest = { version = "0.12.0", features = ["json", "rustls-tls"] }
futures = "0.3.30"
async-stream = "0.3.5"
thiserror = "2.0.18"
utoipa = "5.4.0"
axum = { version = "0.8.8", features = ["macros"] }
hyper = "1.1"
rustls = { version = "0.23", features = ["aws-lc-rs"] }
chrono = {version = "0.4", features = ["serde"] }
reqwest-eventsource = "0.6"
serial_test = { version = "3.0.0", features = ["file_locks"] }
url = "2.5.0"
temp_testdir = "0.2"
tower-http = "0.6.8"
insta = "1.34.0"
async-openai = { version = "0.41.3", features = ["full"] }
base64 = "0.22.1"
imagesize = "0.13"
sqlx = { version = "0.9.0" }
dashmap = "6.1.0"

[workspace.dependencies.uuid]
version = "1.3.3"
features = [
    "v4",                # Lets you generate random UUIDs
    "fast-rng",          # Use a faster (but still sufficiently random) RNG
    "macro-diagnostics", # Enable better diagnostics for compile-time UUIDs
]

[profile.dev.package]
insta.opt-level = 3
