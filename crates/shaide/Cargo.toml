[package]
name = "shaide"
version.workspace = true
edition.workspace = true


default-run = "shaide"

[dependencies]
shaide-common = { path = "../shaide-common" }
axum.workspace = true
hyper = { workspace = true }
tokio = { workspace = true }
utoipa = { workspace = true, features = ["axum_extras", "preserve_order"] }
serde = { workspace = true }
serde_json = { workspace = true }
tower-http = { workspace = true, features = ["cors", "timeout"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
anyhow = { workspace = true }
sysinfo = "0.38.4"
async-stream = { workspace = true }
futures.workspace = true
thiserror.workspace = true
chrono.workspace = true
axum-prometheus = "0.10.0"
uuid.workspace = true
color-eyre = { version = "0.6.3" }
reqwest.workspace = true
async-openai.workspace = true
base64.workspace = true
imagesize.workspace = true
shaide-db = { path = "../shaide-db" }
url = { workspace = true }
tokio-stream = "0.1.18"
sqlx.workspace = true
reqwest-eventsource = { workspace = true }
http = "1.3.1"
google-cloud-aiplatform-v1 = { version = "1.8.0", default-features = false, features = ["prediction-service"] }
fastrand = "2.3.0"
qdrant-client = "1.18.0"
tonic = "0.14.6"
fnv = "1.0.7"
axum-reverse-proxy = "1.1.2"
rustls = { workspace = true }
google-cloud-auth = { version = "1.7.0" } 
azure_core = "1.0.0"
azure_identity = { version = "1.0.0", features = ["tokio"] }
clap = { version = "4.5.31", features = ["derive"] }
dotenv = { package = "dotenv-ng", version = "1", features = ["macros"] }
kube = { version = "4.0.0", features = ["runtime", "derive"] }
k8s-openapi = { version = "0.28.0", features = ["v1_32"] }
dashmap = { workspace  = true }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum", "vendored"] }
argon2 = "0.5.3"
rand_core = { version = "0.6.4", features = ["getrandom"] }
jsonwebtoken = { version = "10.4.0", default-features = false, features = ["aws_lc_rs"] }

[dependencies.openssl]
optional = true
version = "*"

[dev-dependencies]
insta = { workspace = true, features = ["yaml", "redactions"] }
serial_test = { workspace = true }
temp_testdir = { workspace = true }
# The integration-test harness: `oneshot` drives the router without a socket, and the ephemeral-port
# mode needs an HTTP client that can read a response body as it streams.
tower = { version = "0.5.3", features = ["util"] }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread"] }
reqwest = { workspace = true, features = ["json", "stream"] }

[package.metadata.cargo-machete]
ignored = ["openssl"]
