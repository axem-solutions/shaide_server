name: shaide-local-infra

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    image: shaide_server:latest
    extra_hosts:
      - "control-panel.localhost:host-gateway"
      - "host.docker.internal:host-gateway"
    ports:
      - "${SHAIDE_SERVER_PORT:-8080}:${SHAIDE_SERVER_PORT:-8080}"
    environment:
      ADMIN_PASSWORD: admin
      JWT_SECRET: local-development-jwt-secret-change-me
      PORT: ${SHAIDE_SERVER_PORT:-8080}
      SHAIDE_SERVER_UI_FQDN: control-panel.localhost
      SHAIDE_SERVER_UI_PORT: 3000
      WEBAPP_URL: ${WEBAPP_URL:-http://host.docker.internal:3001}
      VECTOR_DB_URL: http://vectordb:6334
      RUST_BACKTRACE: full
      RUST_LIB_BACKTRACE: "1"
      RUST_SPANTRACE: "0"
    # The container runs as root, so `az` gets a private copy of the host's
    # Azure config to refresh tokens in instead of writing root-owned files
    # into ~/.azure.
    command: ["sh", "-c", "cp -r /mnt/host-azure /root/.azure && exec shaide"]
    volumes:
      - ${HOME}/.config/gcloud:/root/.config/gcloud:ro
      # Kept apart from ~/.config/axem, which `just dev` uses: the container runs
      # as root and would leave root-owned files the native server cannot write.
      - ${HOME}/.config/axem-docker:/root/.config/axem
      - type: bind
        source: ${HOME}/.azure
        target: /mnt/host-azure
        read_only: true
        bind:
          # Fail instead of letting Docker create a root-owned ~/.azure.
          create_host_path: false
    depends_on:
      - vectordb

  vectordb:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
      - "6334:6334"

  control-panel:
    image: ghcr.io/axem-solutions/control_panel:dev
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SHAIDE_SERVER_FQDN: ${SHAIDE_SERVER_FQDN:-backend}
      SHAIDE_SERVER_PORT: ${SHAIDE_SERVER_PORT:-8080}

  mcp-gateway:
    image: docker/mcp-gateway:latest
    use_api_socket: true
    command:
      - --transport=sse
      - --port=8811
      - --servers=time
    ports:
      - "8811:8811"
