name: Release

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  build_and_push_image:
    name: Build and Push Docker Image
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"
          echo "version=${BRANCH#release/}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest

      # No `cache-to` here. This workflow is triggered by `pull_request`, and
      # GitHub gives those runs a read-only Actions cache scope ("Cache mode:
      # read" in Set up job) so that a PR cannot poison the cache main reads
      # from. A gha cache export therefore always fails with "failed to reserve
      # cache", which fails the whole build after the image has already been
      # pushed. publish.yml runs on push to main, where the scope is writable,
      # and is what keeps this cache warm.
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          platforms: linux/amd64

      # Tagging runs after the image is published, so a failed build cannot
      # leave a release tag behind pointing at something that was never
      # shipped. The existence checks keep "Re-run jobs" working when a later
      # step fails once the tag is already pushed.
      - name: Create and push tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "Tag $VERSION already exists locally, skipping creation."
          else
            git tag -a "$VERSION" -m "$VERSION"
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists on origin, skipping push."
          else
            git push origin "$VERSION"
          fi

      - name: Extract CHANGELOG section
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          VERSION="${VERSION#v}"
          cat > /tmp/extract_changelog.js <<'NODE_SCRIPT'
          const fs = require('fs');
          const version = process.argv[2];
          const re = new RegExp('^## \\[?' + version.replace(/\./g, '\\.') + '\\]?(\\s|$)');
          const content = fs.existsSync('CHANGELOG.md')
            ? fs.readFileSync('CHANGELOG.md', 'utf-8')
            : '';
          const lines = content.split('\n');
          let inSection = false;
          const out = [];
          for (const line of lines) {
            if (re.test(line)) { inSection = true; continue; }
            if (inSection && line.startsWith('## ')) break;
            if (inSection) out.push(line);
          }
          process.stdout.write(out.join('\n').trim() || 'No changelog available.');
          NODE_SCRIPT
          node /tmp/extract_changelog.js "$VERSION" > /tmp/release_notes.md

      - name: Create GitHub Release
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists, skipping creation."
          else
            gh release create "$VERSION" \
              --title "$VERSION" \
              --notes-file /tmp/release_notes.md
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
