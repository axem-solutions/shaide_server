name: CI

on:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build_and_test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test kc Compose helpers
        env:
          TMPDIR: ${{ runner.temp }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -W error::ResourceWarning -B -m unittest discover -s test/kc-compose -v

      # Installs the version and components pinned in rust-toolchain.toml.
      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustc --version
          cargo clippy --version

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2.8.2

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Build the server
        run: cargo build --verbose --all-features --locked

      - name: Run tests
        run: cargo test --verbose --all-features
